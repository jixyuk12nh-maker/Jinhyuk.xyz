<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>jinhyuk.xyz · 대시보드</title><link rel="stylesheet" href="/style.css"><style>.dash{width:min(1050px,calc(100% - 28px));margin:36px auto}.panel{padding:20px;margin:14px 0;border:1px solid #ffffff1a;border-radius:15px;background:#151517c9}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input{min-width:0;padding:11px;border:1px solid #ffffff25;border-radius:8px;background:#080809;color:white}.btn{padding:10px 13px;border:1px solid #ffffff25;border-radius:8px;background:#ffffff0c;color:#fff}.btn.primary{background:#eee;color:#111}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #ffffff15;border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#aaa;font-size:12px}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:#b7ddb9;font-size:12px}.danger{color:#ffaaaa}.secret{padding:12px;background:#080809;border-radius:8px;overflow-wrap:anywhere}h1{font-size:34px!important;letter-spacing:-1px!important}h2{font-size:18px;margin:0 0 12px}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="moon">☾</span><strong>jinhyuk.xyz</strong></a><nav class="nav"><a href="/obfuscator.html">난독화기</a><a href="/loader.html">로더</a><button class="btn" id="logout">로그아웃</button></nav></header><main class="dash"><p class="eyebrow">개인 작업공간</p><h1>대시보드</h1><p class="muted" id="who">세션 확인 중…</p><section class="panel"><h2>API 키</h2><p class="muted">키 원문은 생성 직후 한 번만 표시됩니다. 최대 5개까지 활성화할 수 있습니다.</p><div class="row"><input class="input" id="keyLabel" maxlength="80" placeholder="키 이름 (예: 로블록스 로더)"><button class="btn primary" id="createKey">API 키 발급</button></div><div id="newSecret" class="secret" hidden></div><div class="list" id="keys"></div></section><section class="panel"><h2>내 스크립트</h2><p class="muted">최대 900 KB/파일. 파일은 D1에 저장되며 계정 소유자만 볼 수 있습니다.</p><div class="row"><input class="input" id="scriptName" placeholder="파일 이름.lua"><input class="input" id="scriptFile" type="file" accept=".lua,.txt,text/plain"><button class="btn primary" id="upload">업로드</button></div><div class="list" id="scripts" style="margin-top:12px"></div></section><p id="message" class="message"></p></main><script>const $=s=>document.querySelector(s);async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});const d=(r.headers.get('content-type')||'').includes('json')?await r.json():await r.text();if(!r.ok)throw Error(d.error||'요청 실패');return d}function say(t,bad=false){$('#message').textContent=t;$('#message').className='message'+(bad?' danger':'')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const me=await api('/api/me');$('#who').textContent=me.email;await Promise.all([loadKeys(),loadScripts()])}catch(e){location.href='/auth.html'}}async function loadKeys(){const d=await api('/api/keys');const box=$('#keys');box.replaceChildren();if(!d.keys.length){box.innerHTML='<p class="muted">발급된 키가 없습니다.</p>';return}for(const k of d.keys){const row=document.createElement('div');row.className='item';row.innerHTML='<div><strong>'+esc(k.label)+'</strong><div class="muted">생성: '+new Date(k.created_at).toLocaleString('ko-KR')+' · '+(k.revoked_at?'폐기됨':'활성')+'</div></div>';if(!k.revoked_at){const b=document.createElement('button');b.className='btn';b.textContent='폐기';b.onclick=async()=>{if(confirm('이 API 키를 폐기할까요?'))try{await api('/api/keys/'+k.id,{method:'DELETE'});loadKeys()}catch(e){say(e.message,true)}};row.append(b)}box.append(row)}}async function loadScripts(){const d=await api('/api/scripts');const box=$('#scripts');box.replaceChildren();if(!d.scripts.length){box.innerHTML='<p class="muted">저장된 스크립트가 없습니다.</p>';return}for(const s of d.scripts){const row=document.createElement('div');row.className='item';row.innerHTML='<div><strong>'+esc(s.name)+'</strong><div class="muted">'+(s.size/1024).toFixed(1)+' KB · '+new Date(s.created_at).toLocaleString('ko-KR')+'</div></div>';const actions=document.createElement('div');actions.className='row';const download=document.createElement('button');download.className='btn';download.textContent='다운로드';download.onclick=async()=>{try{const d=await api('/api/scripts/'+s.id);const u=URL.createObjectURL(new Blob([d.script.source],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download=s.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(e){say(e.message,true)}};const del=document.createElement('button');del.className='btn';del.textContent='삭제';del.onclick=async()=>{if(confirm('삭제할까요?'))try{await api('/api/scripts/'+s.id,{method:'DELETE'});loadScripts()}catch(e){say(e.message,true)}};actions.append(download,del);row.append(actions);box.append(row)}}$('#createKey').onclick=async()=>{try{const d=await api('/api/keys',{method:'POST',body:JSON.stringify({label:$('#keyLabel').value||'기본 키'})});$('#newSecret').hidden=false;$('#newSecret').textContent='이 키를 지금 복사해 안전한 곳에 보관하세요. 다시 표시할 수 없습니다.\n'+d.secret;$('#keyLabel').value='';await loadKeys();say('API 키가 발급되었습니다.')}catch(e){say(e.message,true)}};$('#upload').onclick=async()=>{const f=$('#scriptFile').files[0];if(!f){say('Lua 파일을 선택하세요.',true);return}if(!/\.(lua|txt)$/i.test(f.name)){say('.lua 또는 .txt 파일만 업로드할 수 있습니다.',true);return}try{const source=await f.text();await api('/api/scripts',{method:'POST',body:JSON.stringify({name:$('#scriptName').value||f.name,source})});$('#scriptFile').value='';$('#scriptName').value='';await loadScripts();say('스크립트를 저장했습니다.')}catch(e){say(e.message,true)}};$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{location.href='/'}};load();</script></body></html>

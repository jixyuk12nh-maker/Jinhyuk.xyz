<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>jinhyuk.xyz · 관리자</title><link rel="stylesheet" href="/style.css"><style>.dash{width:min(1050px,calc(100% - 28px));margin:36px auto}.panel{padding:20px;margin:14px 0;border:1px solid #ffffff1a;border-radius:15px;background:#151517c9}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.input{min-width:0;padding:11px;border:1px solid #ffffff25;border-radius:8px;background:#080809;color:white}.btn{padding:10px 13px;border:1px solid #ffffff25;border-radius:8px;background:#ffffff0c;color:#fff}.btn.primary{background:#eee;color:#111}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid #ffffff15;border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#aaa;font-size:12px;line-height:1.6}.message{white-space:pre-wrap;overflow-wrap:anywhere;color:#b7ddb9;font-size:12px}.danger{color:#ffaaaa}.secret{padding:12px;background:#080809;border-radius:8px;overflow-wrap:anywhere}h1{font-size:34px!important;letter-spacing:-1px!important}h2{font-size:18px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.stat{padding:14px;border:1px solid #ffffff15;border-radius:10px}.stat b{display:block;font-size:26px}.stat span{color:#aaa;font-size:12px}.bar{height:6px;margin-top:7px;border-radius:4px;background:#ffffff1c}.bar i{display:block;height:100%;border-radius:4px;background:#e7e7e7}.badge{padding:2px 9px;border:1px solid #ffffff30;border-radius:99px;font-size:11px}.badge.admin{background:#e7e7e7;color:#111}.code{font:700 22px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;user-select:all}#newInvite{display:none;margin-top:14px}#newInvite .row{margin-top:10px}.grow{flex:1;min-width:150px}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="moon">☾</span><strong>jinhyuk.xyz</strong></a><nav class="nav"><a href="/dashboard">대시보드</a><button class="btn" id="logout" type="button">로그아웃</button></nav></header><main class="dash"><p class="eyebrow">관리자</p><h1>관리자 대시보드</h1><p class="muted" id="who">세션 확인 중…</p>
<section class="panel"><h2>방문자</h2><div class="stats"><div class="stat"><b id="sVisits">–</b><span>오늘 방문</span></div><div class="stat"><b id="sUnique">–</b><span>오늘 방문자</span></div><div class="stat"><b id="sMembers">–</b><span>가입자</span></div></div><div class="list" id="dayList"></div><p class="muted">한국 시간 기준 최근 7일이에요. 같은 사람이 하루에 여러 번 와도 방문자는 1명으로 세고, IP 주소 원문은 저장하지 않아요. 기록은 90일 동안만 보관해요.</p></section>
<section class="panel"><h2>초대 코드 만들기</h2><div class="row"><select class="input" id="role" aria-label="권한"><option value="user">일반</option><option value="admin">관리자</option></select><button class="btn primary" id="create" type="button">코드 만들기</button></div><p class="muted" id="roleHint"></p><div id="newInvite" class="secret"><div class="muted" id="newRole"></div><div class="code" id="newCode"></div><div class="row"><button class="btn" id="copy" type="button">복사</button></div></div><h2 style="margin-top:20px">만든 코드</h2><div class="list" id="inviteList"></div></section>
<section class="panel"><h2>가입자</h2><div class="list" id="memberList"></div></section>
<p id="message" class="message"></p></main>
<script>const $=s=>document.querySelector(s);
const ROLE={user:'일반',admin:'관리자'},HINT={user:'일반 코드로 가입한 사람은 대시보드와 난독화기를 쓸 수 있어요.',admin:'관리자 코드로 가입한 사람은 이 관리자 대시보드까지 볼 수 있어요. 믿을 수 있는 사람에게만 주세요.'};
const msg=(t,err)=>{const m=$('#message');m.textContent=t;m.className='message'+(err?' danger':'')};
const fmt=t=>new Date(t).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'});
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e};
const badge=role=>el('span',ROLE[role]||role,'badge'+(role==='admin'?' admin':''));
async function api(path,opts){const r=await fetch(path,{credentials:'same-origin',...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'요청에 실패했습니다 ('+r.status+')');return d}
async function loadOverview(){const d=await api('/api/admin/overview');
$('#sVisits').textContent=d.today.visits;$('#sUnique').textContent=d.today.uniqueVisitors;$('#sMembers').textContent=d.memberCount;
const max=Math.max(1,...d.days.map(x=>x.visits)),days=$('#dayList');days.replaceChildren();
for(const x of d.days){const item=el('div',null,'item'),info=el('div',null,'grow'),bar=el('div',null,'bar'),fill=el('i');fill.style.width=(x.visits/max*100)+'%';bar.append(fill);info.append(el('div',x.day+' · 방문 '+x.visits+' · 방문자 '+x.uniqueVisitors),bar);item.append(info);days.append(item)}
const members=$('#memberList');members.replaceChildren();
for(const m of d.members){const item=el('div',null,'item'),left=el('div');left.append(el('div',m.email),el('div','가입 '+fmt(m.createdAt),'muted'));item.append(left,badge(m.role));members.append(item)}}
async function loadInvites(){const{invites}=await api('/api/admin/invites'),list=$('#inviteList');list.replaceChildren();
if(!invites.length){list.append(el('p','아직 만든 초대 코드가 없습니다.','muted'));return}
for(const i of invites){const item=el('div',null,'item'),info=el('div'),top=el('div','\u2022\u2022\u2022\u2022-\u2022\u2022\u2022\u2022-'+i.hint+' ');top.append(badge(i.role));
info.append(top,el('div',{active:'사용 가능 · '+fmt(i.expiresAt)+'까지',used:'사용됨 · '+(i.usedEmail||'')+' · '+fmt(i.usedAt),expired:'만료됨 · '+fmt(i.expiresAt)}[i.status],'muted'));item.append(info);
if(i.status!=='used'){const b=el('button','삭제','btn');b.type='button';b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/invites/'+i.id,{method:'DELETE'});await loadInvites()}catch(e){msg(e.message,true);b.disabled=false}};item.append(b)}
list.append(item)}}
$('#role').onchange=()=>{$('#roleHint').textContent=HINT[$('#role').value]};$('#roleHint').textContent=HINT.user;
$('#create').onclick=async()=>{const b=$('#create');b.disabled=true;try{const d=await api('/api/admin/invites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('#role').value})});$('#newRole').textContent=ROLE[d.role]+' 코드 · '+fmt(d.expiresAt)+'까지 · 1회용';$('#newCode').textContent=d.code;$('#newInvite').style.display='block';msg('초대 코드를 만들었습니다. 지금 복사해 두세요. 이 화면을 떠나면 다시 볼 수 없습니다.');await loadInvites()}catch(e){msg(e.message,true)}finally{b.disabled=false}};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#newCode').textContent);msg('복사했습니다.')}catch{msg('복사하지 못했습니다. 코드를 길게 눌러 직접 복사하세요.',true)}};
$('#logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'})}finally{location.href='/'}};
async function load(){let ok=false;try{const r=await fetch('/api/me',{credentials:'same-origin'});if(!r.ok)throw 0;const me=await r.json();if(me.role!=='admin'){location.href='/dashboard';return}$('#who').textContent=me.email+' · 관리자';ok=true}catch{location.href='/auth'}if(ok)for(const f of[loadOverview,loadInvites])f().catch(e=>msg(e.message,true))}
load();</script></body></html>

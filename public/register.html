.card{border:1px solid rgba(255,255,255,.42)!important;background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.025) 42%,rgba(205,205,210,.075)),rgba(17,17,18,.25)!important;-webkit-backdrop-filter:blur(28px) saturate(145%)!important;backdrop-filter:blur(28px) saturate(145%)!important;box-shadow:inset 0 1.5px rgba(255,255,255,.31),inset 1px 0 rgba(255,255,255,.08),inset 0 -1px rgba(255,255,255,.09),0 28px 82px rgba(0,0,0,.46)!important}
.social-button,.submit{border:1px solid rgba(255,255,255,.36)!important;background:linear-gradient(135deg,rgba(255,255,255,.19),rgba(255,255,255,.045) 56%,rgba(210,210,215,.10))!important;-webkit-backdrop-filter:blur(17px) saturate(140%)!important;backdrop-filter:blur(17px) saturate(140%)!important;box-shadow:inset 0 1px rgba(255,255,255,.26),inset 0 -1px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.2)!important}
.social-button:hover,.submit:hover{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08) 56%,rgba(225,225,230,.16))!important;border-color:rgba(255,255,255,.52)!important}
.input{border:1px solid rgba(255,255,255,.29)!important;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.025)),rgba(8,8,9,.23)!important;-webkit-backdrop-filter:blur(15px) saturate(135%)!important;backdrop-filter:blur(15px) saturate(135%)!important;box-shadow:inset 0 1px rgba(255,255,255,.13)!important}
.toggle-password,.toggle-password:hover{border:0!important;outline:0!important;box-shadow:none!important;background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
@media(prefers-reduced-transparency:reduce){.site-head,.card,.social-button,.submit,.input{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}


/* Final edge finish: one-pixel borders, consistent curves, no eye-button frame. */
.site-head,.card{border-width:1px!important;border-style:solid!important;background-clip:padding-box;border-radius:15px!important}
.card{border-radius:17px!important}
.social-button,.submit,.input{border-width:1px!important;border-style:solid!important;background-clip:padding-box}
.social-button,.submit{border-color:rgba(255,255,255,.34)!important;border-radius:10px!important}
.input{border-color:rgba(255,255,255,.26)!important;border-radius:9px!important}
.site-head{border-color:rgba(255,255,255,.40)!important}
.card{border-color:rgba(255,255,255,.34)!important}
.toggle-password,.toggle-password:hover{border:0!important;outline:0!important;box-shadow:none!important}

</style>
</head>
<body>
<header class="site-head"><a href="/" aria-label="jinhyuk.xyz home"><span class="site-head-mark">J</span><span>jinhyuk.xyz</span></a></header>
<main class="card">
  <h1>Create account</h1>
  <div class="socials">
    <button class="social-button" type="button" data-provider="google"><span class="social-icon google-mark" aria-hidden="true">G</span><span>Continue with Google</span></button>
    <button class="social-button" type="button" data-provider="discord"><svg class="discord-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.7 5.2a18.8 18.8 0 0 0-4.6-1.4l-.6 1.2a17 17 0 0 0-5 0l-.6-1.2a18.8 18.8 0 0 0-4.6 1.4C1.4 9.5.6 13.7 1 17.8a18.8 18.8 0 0 0 5.7 2.9l1.2-2a12 12 0 0 1-1.9-.9l.5-.4a13.5 13.5 0 0 0 11 0l.5.4-1.9.9 1.2 2a18.8 18.8 0 0 0 5.7-2.9c.5-4.8-.8-8.9-3.3-12.6ZM8.8 14.9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Zm6.4 0c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2Z"/></svg><span>Continue with Discord</span></button>
  </div>
  <div class="divider"><span>or</span></div>
  <form id="registerForm" novalidate>
    <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required></div>
    <div class="field"><label for="inviteCode">Invite code</label><input class="input" id="inviteCode" name="inviteCode" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter your invite code" required maxlength="120"></div>
<div class="field"><label for="password">Password</label><div class="input-wrap"><input class="input password-input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Secure password" minlength="8" required><button class="toggle-password" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button></div></div>
    <div class="field"><label for="confirmPassword">Confirm password</label><div class="input-wrap"><input class="input password-input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" minlength="8" required><button class="toggle-password" type="button" aria-label="Show confirmation password" aria-pressed="false" data-toggle-target="confirmPassword"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/></svg></button></div></div>
    <label class="terms"><input type="checkbox" id="agree" name="agree" required><span>I agree to the <a href="/">Terms of Service</a> and <a href="/">Privacy Policy</a>.</span></label>
    <div class="message" id="formMessage" role="status" aria-live="polite"></div>
    <button class="submit" type="submit">Register</button>
  </form>
  <p class="login">Already have an account? <a href="/login">Login</a></p>
</main>
<footer class="legal-footer" aria-label="Legal information"><a href="/">Privacy Policy</a><span class="sep">·</span><a href="/">Terms of Service</a><span class="sep">·</span><span>© 2026 jinhyuk.xyz</span></footer>
<script>
(()=>{
 const form=document.querySelector('#registerForm'),message=document.querySelector('#formMessage'),submit=form.querySelector('.submit'),password=document.querySelector('#password'),toggle=document.querySelector('.toggle-password');
 const show=(text,type='error')=>{message.textContent=text;message.className='message show '+type};
 toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',visible?'Hide password':'Show password')});
 document.querySelectorAll('[data-toggle-target]').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.toggleTarget),visible=input.type==='password';input.type=visible?'text':'password';button.setAttribute('aria-pressed',String(visible));button.setAttribute('aria-label',visible?'Hide confirmation password':'Show confirmation password')}));
 document.querySelectorAll('[data-provider]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.provider==='google'?'Google sign-up is not connected yet.':'Discord sign-up is not connected yet.')));
 form.addEventListener('submit',async event=>{event.preventDefault();message.className='message';if(!form.reportValidity())return;if(password.value!==document.querySelector('#confirmPassword').value){show('Passwords do not match.');document.querySelector('#confirmPassword').focus();return}if(!document.querySelector('#agree').checked){show('Please agree to the Terms of Service and Privacy Policy.');return}submit.disabled=true;submit.textContent='Creating account…';try{const response=await fetch('/api/auth/signup',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value.trim(),password:form.password.value,inviteCode:document.querySelector('#inviteCode').value.trim()})});let data={};try{data=await response.json()}catch{}if(!response.ok)throw Error(data.error||'Registration could not be completed. Please try again.');show(data.message||'Account created. Redirecting to your dashboard.','success');location.href='/dashboard'}catch(error){show(error.message||'Registration could not be completed. Please try again.')}finally{submit.disabled=false;submit.textContent='Register'}});
})();
</script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>LuaMoon · 계정</title><link rel="stylesheet" href="/style.css"><style>.auth{width:min(460px,calc(100% - 28px));margin:9vh auto;padding:26px;border:1px solid #ffffff1b;border-radius:18px;background:#151517d9;box-shadow:0 24px 80px #0007}.auth h1{font-size:28px;letter-spacing:-1px}.auth p{color:#aaa;font-size:12px;line-height:1.7}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button,.field button{padding:10px 12px;border:1px solid #ffffff20;border-radius:9px;background:#ffffff08;color:#fff}.tabs button.active{background:#ffffff18}.field{margin:13px 0}.field label{display:block;margin-bottom:7px;color:#ddd;font-size:12px}.field input{width:100%;padding:12px;border:1px solid #ffffff22;border-radius:9px;background:#080809;color:#fff}.submit{width:100%;margin-top:10px;padding:12px;border:1px solid #ffffff30;border-radius:10px;background:#e7e7e7;color:#111;font-weight:700}.msg{min-height:20px;margin-top:12px;color:#aaa;font-size:12px}.msg.error{color:#ff9b9b}.msg.ok{color:#a5e2b7}.hidden{display:none}</style></head><body><main class="auth"><a href="/" class="brand"><span class="moon">☾</span><strong>LuaMoon</strong></a><h1 id="heading">로그인</h1><p>계정은 이메일과 초대 코드로 생성됩니다. 비밀번호는 서버에서 해시 처리됩니다.</p><div class="tabs"><button id="loginTab" class="active" type="button">로그인</button><button id="signupTab" type="button">회원가입</button></div><form id="form"><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="password">비밀번호 (10자 이상)</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="200"></div><div class="field hidden" id="inviteWrap"><label for="invite">초대 코드</label><input id="invite" type="password" autocomplete="off"></div><button class="submit" id="submit" type="submit">로그인</button><div class="msg" id="msg" role="status"></div></form><p><a href="/">← 메인으로</a></p></main><script>const $=s=>document.querySelector(s);let mode='login';function setMode(m){mode=m;$('#loginTab').classList.toggle('active',m==='login');$('#signupTab').classList.toggle('active',m==='signup');$('#inviteWrap').classList.toggle('hidden',m!=='signup');$('#invite').required=m==='signup';$('#heading').textContent=m==='login'?'로그인':'회원가입';$('#submit').textContent=m==='login'?'로그인':'계정 만들기';$('#password').autocomplete=m==='login'?'current-password':'new-password';$('#msg').textContent=''}$('#loginTab').onclick=()=>setMode('login');$('#signupTab').onclick=()=>setMode('signup');$('#form').onsubmit=async e=>{e.preventDefault();const b=$('#submit'),msg=$('#msg');b.disabled=true;msg.className='msg';msg.textContent='처리 중…';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:$('#email').value,password:$('#password').value,inviteCode:$('#invite').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');msg.className='msg ok';msg.textContent='완료. 대시보드로 이동합니다.';location.href='/dashboard.html'}catch(err){msg.className='msg error';msg.textContent=err.message}finally{b.disabled=false}};fetch('/api/me').then(r=>{if(r.ok)location.href='/dashboard.html'}).catch(()=>{});</script></body></html>

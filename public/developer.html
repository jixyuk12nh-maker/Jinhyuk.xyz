<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>개발자 스튜디오</title><link rel="stylesheet" href="/style.css"><style>
.admin{width:min(1180px,calc(100% - 28px));margin:34px auto 70px}.panel{padding:18px;margin:14px 0;border:1px solid #ffffff1a;border-radius:14px;background:#151517d9}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,.tab{padding:10px 13px;border:1px solid #ffffff25;border-radius:8px;background:#ffffff0c;color:#fff;cursor:pointer}.btn.primary,.tab.active{background:#eee;color:#111}.input{min-width:0;padding:10px;border:1px solid #ffffff25;border-radius:8px;background:#080809;color:#fff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid #ffffff18;border-radius:10px;background:#ffffff05}.stat b{display:block;font-size:24px;margin-top:8px}.muted{color:#aaa;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #ffffff12;vertical-align:top}th{color:#aaa;font-weight:600}.pill{display:inline-block;padding:4px 7px;border-radius:6px;background:#ffffff12}.danger{color:#ffaaaa}.hidden{display:none!important}.msg{white-space:pre-wrap;color:#b7ddb9;font-size:12px}.admin-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}h1{font-size:34px!important;letter-spacing:-1px!important}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="moon">☾</span><strong>개발자 스튜디오</strong></a><nav class="nav"><a href="/">사이트</a><button class="btn" id="logout">로그아웃</button></nav></header><main class="admin"><p class="eyebrow">RESTRICTED ACCESS</p><h1>개발자 스튜디오</h1><p class="muted" id="who">권한 확인 중…</p><section class="panel"><div class="stats"><div class="stat">가입자<b id="statUsers">—</b></div><div class="stat">방문 IP<b id="statVisitors">—</b></div><div class="stat">차단 계정<b id="statBlocked">—</b></div><div class="stat">24시간 인증 실패<b id="statFailed">—</b></div></div></section><div class="tabs"><button class="tab active" data-tab="visitors">방문자</button><button class="tab" data-tab="users">가입자</button><button class="tab" data-tab="blacklist">IP 블랙리스트</button></div><section id="visitors" class="panel"><h2>방문자 기록</h2><p class="muted">사이트 방문 및 로그인·회원가입 인증 결과. IP는 보안 목적으로만 확인하세요.</p><div class="admin-tools"><input class="input" id="visitorSearch" placeholder="IP / 결과 / 사유 검색"><button class="btn" id="refreshVisitors">새로고침</button></div><div class="table-wrap"><table><thead><tr><th>시각</th><th>IP</th><th>이벤트</th><th>결과</th><th>사유 / 경로</th><th>사용자 에이전트</th><th>조치</th></tr></thead><tbody id="visitorRows"></tbody></table></div></section><section id="users" class="panel hidden"><h2>가입자 관리</h2><div class="admin-tools"><input class="input" id="userSearch" placeholder="ID / 이메일 / IP 검색"><button class="btn" id="refreshUsers">새로고침</button></div><div class="table-wrap"><table><thead><tr><th>사용자 ID</th><th>이메일</th><th>가입 일시</th><th>최근 접속</th><th>최근 IP</th><th>권한</th><th>상태</th><th>작업</th></tr></thead><tbody id="userRows"></tbody></table></div></section><section id="blacklist" class="panel hidden"><h2>IP 블랙리스트</h2><div id="ownerTools" class="admin-tools hidden"><input class="input" id="blockIp" placeholder="IPv4 또는 IPv6 주소"><input class="input" id="blockReason" placeholder="차단 사유"><button class="btn primary" id="addIp">IP 차단</button></div><p class="muted" id="blacklistHint"></p><div class="table-wrap"><table><thead><tr><th>IP</th><th>사유</th><th>등록 일시</th><th>등록자</th><th>작업</th></tr></thead><tbody id="blacklistRows"></tbody></table></div></section><p class="msg" id="message"></p><p class="muted">관리자 지정·해제와 IP 블랙리스트 변경은 소유자만 할 수 있습니다. 방문자 IP와 로그는 필요한 기간만 보관하세요.</p></main><script>
const $=s=>document.querySelector(s);let me,users=[],visitors=[],blacklist=[];async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',...opts,headers:{...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'요청 실패');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(v){return v?new Date(v).toLocaleString():'—'}function say(v,bad=false){$('#message').textContent=v;$('#message').className='msg'+(bad?' danger':'')}function setTab(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['visitors','users','blacklist'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==name))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));async function init(){try{me=await api('/api/me');if(!me.isAdmin)throw Error('관리자 권한이 없습니다.');$('#who').textContent=me.email+' · '+(me.isOwner?'소유자':'관리자')+' · ID '+me.id;if(me.isOwner)$('#ownerTools').classList.remove('hidden');else $('#blacklistHint').textContent='IP 블랙리스트 변경은 소유자만 가능합니다.';await refreshAll()}catch(e){location.href='/auth.html'}}async function refreshAll(){await Promise.all([loadOverview(),loadVisitors(),loadUsers(),loadBlacklist()])}async function loadOverview(){const d=await api('/api/admin/overview');$('#statUsers').textContent=d.users;$('#statVisitors').textContent=d.visitors;$('#statBlocked').textContent=d.blocked;$('#statFailed').textContent=d.failed24h}async function loadVisitors(){const d=await api('/api/admin/visitors');visitors=d.visitors||[];renderVisitors()}function renderVisitors(){const q=$('#visitorSearch').value.toLowerCase();$('#visitorRows').innerHTML=visitors.filter(v=>[v.ip,v.event,v.outcome,v.reason,v.user_agent].join(' ').toLowerCase().includes(q)).map(v=>`<tr><td>${date(v.created_at)}</td><td>${esc(v.ip)}</td><td>${esc(v.event)}</td><td><span class="pill">${esc(v.outcome)}</span></td><td>${esc(v.reason)}</td><td>${esc(String(v.user_agent||'').slice(0,100))}</td><td>${me.isOwner&&v.ip!=='unknown'?`<button class="btn" data-ip="${esc(v.ip)}">IP 차단</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7">기록이 없습니다.</td></tr>';document.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{setTab('blacklist');$('#blockIp').value=b.dataset.ip;$('#blockReason').value='방문자 관리에서 차단'} )}async function loadUsers(){const d=await api('/api/admin/users');users=d.users||[];renderUsers()}function renderUsers(){const q=$('#userSearch').value.toLowerCase();$('#userRows').innerHTML=users.filter(u=>[u.id,u.email,u.last_ip,u.role,u.status].join(' ').toLowerCase().includes(q)).map(u=>{const actions=[];if(u.role!=='owner'){actions.push(`<button class="btn" data-action="${u.status==='blocked'?'unblock':'block'}" data-id="${esc(u.id)}">${u.status==='blocked'?'차단 해제':'계정 차단'}</button>`);if(me.isOwner)actions.push(`<button class="btn" data-action="${u.role==='admin'?'demote':'promote'}" data-id="${esc(u.id)}">${u.role==='admin'?'관리자 해제':'관리자 지정'}</button>`)}return `<tr><td><code>${esc(u.id)}</code></td><td>${esc(u.email)}</td><td>${date(u.created_at)}</td><td>${date(u.last_login_at)}</td><td>${esc(u.last_ip||'—')}</td><td>${esc(u.role)}</td><td>${u.status==='blocked'?'🔴 차단':'🟢 정상'}</td><td><div class="row">${actions.join(' ')||'—'}</div></td></tr>`}).join('')||'<tr><td colspan="8">가입자가 없습니다.</td></tr>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const action=b.dataset.action,id=b.dataset.id;if(!confirm(`${id} 계정에 ${action} 작업을 적용할까요?`))return;try{await api(`/api/admin/users/${id}/${action}`,{method:'POST',body:'{}'});say('작업을 완료했습니다.');await refreshAll()}catch(e){say(e.message,true)}})}async function loadBlacklist(){const d=await api('/api/admin/blacklist');blacklist=d.blacklist||[];$('#blacklistRows').innerHTML=blacklist.map(x=>`<tr><td>${esc(x.ip)}</td><td>${esc(x.reason)}</td><td>${date(x.created_at)}</td><td>${esc(x.created_by)}</td><td>${me.isOwner?`<button class="btn" data-unblock="${esc(x.ip)}">차단 해제</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">블랙리스트가 비어 있습니다.</td></tr>';document.querySelectorAll('[data-unblock]').forEach(b=>b.onclick=async()=>{if(!confirm(`${b.dataset.unblock} 차단을 해제할까요?`))return;try{await api('/api/admin/blacklist/'+encodeURIComponent(b.dataset.unblock),{method:'DELETE'});await loadBlacklist();say('IP 차단을 해제했습니다.')}catch(e){say(e.message,true)}})}$('#visitorSearch').oninput=renderVisitors;$('#userSearch').oninput=renderUsers;$('#refreshVisitors').onclick=loadVisitors;$('#refreshUsers').onclick=loadUsers;$('#addIp').onclick=async()=>{try{await api('/api/admin/blacklist',{method:'POST',body:JSON.stringify({ip:$('#blockIp').value,reason:$('#blockReason').value})});$('#blockIp').value='';$('#blockReason').value='';await loadBlacklist();say('IP를 블랙리스트에 등록했습니다.')}catch(e){say(e.message,true)}};$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}finally{location.href='/'}};init();
</script></body></html>

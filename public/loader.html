<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>jinhyuk.xyz · 로더 스튜디오</title><link rel="stylesheet" href="/style.css"><style>.dash{width:min(980px,calc(100% - 28px));margin:36px auto}.panel{padding:20px;margin:14px 0;border:1px solid #ffffff1a;border-radius:15px;background:#151517c9}.input,select{min-width:0;padding:11px;border:1px solid #ffffff25;border-radius:8px;background:#080809;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border:1px solid #ffffff25;border-radius:8px;background:#ffffff0c;color:#fff}.btn.primary{background:#eee;color:#111}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;border-radius:10px;background:#080809;border:1px solid #ffffff15;color:#ddd}.muted{color:#aaa;font-size:12px}h1{font-size:34px!important;letter-spacing:-1px!important}h2{font-size:18px;margin:0 0 12px}.msg{font-size:12px;color:#b7ddb9}</style></head><body><header class="topbar"><a class="brand" href="/"><span class="moon">☾</span><strong>jinhyuk.xyz</strong></a><nav class="nav"><a href="/dashboard.html">대시보드</a><a href="/obfuscator.html">난독화기</a></nav></header><main class="dash"><p class="eyebrow">스크립트 배포</p><h1>로더 스튜디오</h1><p class="muted">저장된 스크립트와 API 키를 선택해 로더 코드를 만듭니다. 생성 코드 안에 API 키가 포함되므로 스크립트 공유 시 주의하세요.</p><section class="panel"><h2>로더 설정</h2><div class="row"><label>스크립트 <select id="script"></select></label><label>API 키 <select id="key"></select></label><button class="btn primary" id="build">로더 생성</button></div><p class="muted">스크립트가 없거나 API 키가 없다면 먼저 대시보드에서 업로드/발급하세요.</p></section><section class="panel"><h2>생성된 로더</h2><pre id="output">-- 로더가 여기에 표시됩니다.</pre><div class="row"><button class="btn" id="copy" disabled>복사</button><button class="btn" id="download" disabled>다운로드</button></div><p class="msg" id="msg"></p></section></main><script>const $=s=>document.querySelector(s);let generated='';async function api(p){const r=await fetch(p,{credentials:'same-origin'});const d=await r.json();if(!r.ok)throw Error(d.error||'요청 실패');return d}async function init(){try{const me=await api('/api/me').catch(()=>({authenticated:false}));if(!me.authenticated)throw Error('로그인이 필요합니다.');const [s,k]=await Promise.all([api('/api/scripts'),api('/api/keys')]);const fill=(sel,items)=>sel.replaceChildren(...items.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.name??x.label;return o}));fill($('#script'),s.scripts);fill($('#key'),k.keys.filter(x=>!x.revoked_at));if(!s.scripts.length||!k.keys.some(x=>!x.revoked_at))$('#msg').textContent='스크립트와 활성 API 키가 필요합니다.'}catch(e){$('#msg').textContent=e.message;setTimeout(()=>location.href='/auth.html',700)}}$('#build').onclick=()=>{const sid=$('#script').value,kid=$('#key').value;if(!sid||!kid){$('#msg').textContent='스크립트와 API 키를 선택하세요.';return}generated='local URL = "https://jinhyuk.xyz/api/loader/'+sid+'"\nlocal API_KEY = "YOUR_API_KEY_HERE" -- 여기에 대시보드에서 발급한 키를 넣으세요\n\nlocal requestFn = (syn and syn.request) or (http and http.request) or request or http_request\nassert(requestFn, "HTTP request function is not available in this executor")\nlocal response = requestFn({\n    Url = URL,\n    Method = "GET",\n    Headers = { ["x-api-key"] = API_KEY }\n})\nassert(response and (response.StatusCode == 200), "jinhyuk.xyz loader request failed")\nlocal source = response.Body or response.body\nassert(type(source) == "string" and #source > 0, "Empty script response")\nlocal fn, err = loadstring(source)\nassert(fn, err)\nreturn fn()\n';$('#output').textContent=generated;$('#copy').disabled=$('#download').disabled=false;$('#msg').textContent='로더가 생성되었습니다. API_KEY 자리표시자를 실제 키로 바꾸세요.'};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(generated);$('#msg').textContent='복사했습니다.'}catch{$('#msg').textContent='클립보드 권한을 확인하세요.'}};$('#download').onclick=()=>{const u=URL.createObjectURL(new Blob([generated],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download='jinhyuk-loader.lua';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};init();</script></body></html>
